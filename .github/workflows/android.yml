name: Android APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Optional private signing key
        env:
          KEYSTORE_B64: ${{ secrets.TALDOC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TALDOC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          TALDOC_KEYSTORE_PASSWORD: ${{ secrets.TALDOC_KEYSTORE_PASSWORD }}
          TALDOC_KEY_ALIAS: ${{ secrets.TALDOC_KEY_ALIAS }}
          TALDOC_KEY_PASSWORD: ${{ secrets.TALDOC_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TALdoc-AI-$VERSION.apk"
          ls -la dist
          unzip -l dist/*.apk | sort -k1 -n -r | head -12

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: TALdoc-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
